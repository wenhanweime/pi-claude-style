name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npm install --global @earendil-works/pi-coding-agent@1.5.0 --no-audit --no-fund
      - run: node scripts/smoke.mjs
      - run: python3 scripts/tui-smoke.py
      - name: Install and restore in an isolated agent directory
        shell: bash
        run: |
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          node scripts/setup.mjs install
          node -e 'const fs=require("node:fs"); const p=process.env.PI_CODING_AGENT_DIR+"/settings.json"; if (JSON.parse(fs.readFileSync(p)).theme !== "claude-warm") process.exit(1)';
          node scripts/setup.mjs uninstall
